[pytest]
markers=
        sanity:This is sanity test cases marker
        regression:Regression test case marker
        smoke:smoke test caes marker

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file=logs\execution.data.log
log_file_level=INFO


